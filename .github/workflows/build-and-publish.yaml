name: Build changed packages and publish to R2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.changed.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find package dirs with a version bump
        id: changed
        run: |
          before="${{ github.event.before }}"
          if [[ -z "$before" ]] || [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
            before=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi

          if [[ -z "$before" ]]; then
            candidates=$(find . -maxdepth 2 -name PKGBUILD -printf '%h\n' | sed 's#^\./##' | sort -u)
          else
            candidates=$(git diff --name-only "$before" HEAD -- '*/PKGBUILD' | xargs -n1 dirname 2>/dev/null | sort -u)
          fi

          read_version() {
            # $1 = PKGBUILD contents, echoes "pkgver-pkgrel"
            ( set -e
              eval "$(printf '%s\n' "$1" | grep -E '^\s*pkgver=|^\s*pkgrel=')"
              printf '%s-%s' "$pkgver" "$pkgrel"
            )
          }

          result=()
          for dir in $candidates; do
            [[ -f "$dir/PKGBUILD" ]] || continue
            newcontents=$(cat "$dir/PKGBUILD")
            newver=$(read_version "$newcontents") || { echo "Skip $dir: cannot parse new PKGBUILD" >&2; continue; }

            oldcontents=$(git show "$before:$dir/PKGBUILD" 2>/dev/null || true)
            if [[ -z "$oldcontents" ]]; then
              echo "New package dir: $dir ($newver)"
              result+=("$dir")
              continue
            fi

            oldver=$(read_version "$oldcontents") || { echo "Skip $dir: cannot parse old PKGBUILD" >&2; continue; }

            if [[ "$newver" == "$oldver" ]]; then
              echo "Skip $dir: version unchanged ($newver)"
              continue
            fi

            if dpkg --compare-versions "$newver" gt "$oldver"; then
              echo "Bumped: $dir ($oldver -> $newver)"
              result+=("$dir")
            else
              echo "Skip $dir: version did not increase ($oldver -> $newver)"
            fi
          done

          json=$(printf '%s\n' "${result[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Package dirs to build:"
          echo "$json"
          echo "dirs=$json" >> "$GITHUB_OUTPUT"

  build-and-publish:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.dirs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkgdir: ${{ fromJson(needs.detect-changes.outputs.dirs) }}

    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Setup pacman.conf + mirrorlist
        run: |
          cp gh-actions/pacman.conf /etc/pacman.conf
          cp gh-actions/mirrorlist /etc/pacman.d/mirrorlist

      - name: Init pacman keyring
        run: |
          pacman-key --init
          pacman-key --populate archlinux

          pacman-key -a gh-actions/keys/pearos.gpg
          pacman-key --lsign-key 4C1A9F3C131ACA95

          pacman-key -a gh-actions/keys/inled.gpg
          pacman-key --lsign-key 89F828A9675B63CD0077CE9965AA57CF36E2018F

      - name: Install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel sudo git rclone

          # cachyos-keyring ships a hook that appends [cachyos] to
          # pacman.conf on install (see gh-actions/pacman.conf - it's not
          # defined there, only [pearos]/[inled]/core/extra/multilib are).
          # Several packages in [pearos] pull it in transitively (via
          # pear-temp-fix), so it can appear mid-build inside makepkg's own
          # dependency resolution - a newly-appended repo with no synced
          # database makes pacman refuse to resolve *any* further
          # dependencies, from any repo. Install it explicitly now and
          # re-sync, so [cachyos] is already valid before makepkg ever runs.
          pacman -S --noconfirm --needed cachyos-keyring
          pacman -Sy --noconfirm

      - name: Create unprivileged build user
        run: |
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builduser
          chown -R builduser:builduser "$GITHUB_WORKSPACE"

      - name: Import source PGP keys declared in PKGBUILD
        run: |
          cd "${{ matrix.pkgdir }}"
          keys=$(bash -c "source PKGBUILD; printf '%s\n' \"\${validpgpkeys[@]}\"" 2>/dev/null)
          [[ -z "$keys" ]] && exit 0
          sudo -u builduser gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys $keys

      - name: Build package
        run: |
          cd "${{ matrix.pkgdir }}"
          sudo -u builduser makepkg -s --noconfirm --needed

      - name: Stage built package(s) outside the checkout
        run: |
          shopt -s nullglob
          pkgs=("${{ matrix.pkgdir }}"/*.pkg.tar.zst)
          if (( ${#pkgs[@]} == 0 )); then
            echo "No package produced in ${{ matrix.pkgdir }}, skipping." >&2
            exit 1
          fi
          mkdir -p /tmp/built-pkgs
          cp "${pkgs[@]}" /tmp/built-pkgs/

      - name: Stage sign.sh in an isolated working dir
        run: |
          # sign.sh runs `rclone sync --delete-after`, which would delete
          # anything under $GITHUB_WORKSPACE not matching its allowlist
          # (including .git!) if run against the git checkout directly.
          # Run it in an empty scratch dir instead.
          mkdir -p /tmp/r2-stage
          cp sign.sh /tmp/r2-stage/sign.sh
          chmod +x /tmp/r2-stage/sign.sh

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$GPG_PASSPHRASE" > /tmp/r2-stage/.gpg-passphrase
          chmod 600 /tmp/r2-stage/.gpg-passphrase

      - name: Configure rclone (R2)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          mkdir -p "${HOME}/.config/rclone"
          cat > "${HOME}/.config/rclone/rclone.conf" <<EOF
          [r2-pearos]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT_URL}
          acl = private
          EOF

      - name: Pull current repo state from R2
        working-directory: /tmp/r2-stage
        run: ./sign.sh --pull

      - name: Restore sign.sh (pull may overwrite it with the R2 copy)
        run: |
          cp sign.sh /tmp/r2-stage/sign.sh
          chmod +x /tmp/r2-stage/sign.sh

      - name: Drop built package(s) into staging dir
        run: cp /tmp/built-pkgs/*.pkg.tar.zst /tmp/r2-stage/

      - name: Sign, rebuild db, push to R2
        working-directory: /tmp/r2-stage
        run: ./sign.sh

      - name: Clean up passphrase
        if: always()
        run: rm -f /tmp/r2-stage/.gpg-passphrase
