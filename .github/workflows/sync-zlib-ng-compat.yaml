name: Keep zlib-ng-compat in step with CachyOS

# zlib-ng-compat in this repo is a repackaged CachyOS build (see zlib-ng-compat/PKGBUILD for why).
# [pearos] is the first repo, so it shadows [cachyos]: without this check it would stay on the
# version it was published with. Once a day, look at the CachyOS database; when it has a newer
# version, bump pkgver/pkgrel and start the normal build-and-publish workflow.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare with CachyOS
        id: cmp
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools zstd
          base=https://mirror.cachyos.org/repo/x86_64/cachyos
          tmp=$(mktemp -d)
          curl -fsSL --retry 3 "$base/cachyos.db" -o "$tmp/cachyos.db"
          # database entries are directories named <pkgname>-<pkgver>-<pkgrel>
          entry=$(bsdtar -tf "$tmp/cachyos.db" | grep -E '^zlib-ng-compat-[^/]+/$' | head -n1 | tr -d '/')
          if [ -z "$entry" ]; then
            echo "zlib-ng-compat is not in the CachyOS database, nothing to do."
            echo "bump=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          upstream=${entry#zlib-ng-compat-}                     # e.g. 2.3.3-2
          up_ver=${upstream%-*}; up_rel=${upstream##*-}
          cur_ver=$(sed -n 's/^pkgver=//p' zlib-ng-compat/PKGBUILD | head -n1)
          cur_rel=$(sed -n 's/^pkgrel=//p' zlib-ng-compat/PKGBUILD | head -n1)
          echo "CachyOS: $up_ver-$up_rel   here: $cur_ver-$cur_rel"
          if [ "$up_ver-$up_rel" = "$cur_ver-$cur_rel" ]; then
            echo "Up to date."; echo "bump=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! dpkg --compare-versions "$up_ver-$up_rel" gt "$cur_ver-$cur_rel"; then
            echo "CachyOS is not newer than ours, leaving it alone."; echo "bump=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # the file the PKGBUILD downloads has to exist before we publish a bump
          curl -fsI "$base/zlib-ng-compat-$up_ver-$up_rel-x86_64.pkg.tar.zst" >/dev/null || {
            echo "::warning::zlib-ng-compat-$up_ver-$up_rel-x86_64.pkg.tar.zst is not on the mirror (yet)."
            echo "bump=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "bump=true" >> "$GITHUB_OUTPUT"
          echo "ver=$up_ver" >> "$GITHUB_OUTPUT"
          echo "rel=$up_rel" >> "$GITHUB_OUTPUT"

      - name: Bump the PKGBUILD and start the build
        if: steps.cmp.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sed -i "s/^pkgver=.*/pkgver=${{ steps.cmp.outputs.ver }}/; s/^pkgrel=.*/pkgrel=${{ steps.cmp.outputs.rel }}/" zlib-ng-compat/PKGBUILD
          git config user.name "pearOS build bot"
          git config user.email "actions@users.noreply.github.com"
          git add zlib-ng-compat/PKGBUILD
          git commit -m "zlib-ng-compat: follow CachyOS (${{ steps.cmp.outputs.ver }}-${{ steps.cmp.outputs.rel }})"
          git push origin HEAD:main
          # a push made with GITHUB_TOKEN does not start other workflows; a dispatch does
          gh workflow run build-and-publish.yaml --ref main
